<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>User Cards Grid</title>

        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        <style>
            body {
                background: #0f1115;
                font-family: Arial, sans-serif;
                color: #fff;
            }

            .wrapper {
                padding: 20px;
            }

            .top-bar {
                margin-bottom: 20px;
            }

            .form-control {
                background: #1a1d24;
                border: 1px solid #2d313b;
                color: #fff;
            }

            .form-control:focus {
                background: #1a1d24;
                color: #fff;
                border-color: #4d8cff;
                box-shadow: none;
            }

            .btn-custom {
                background: #4d8cff;
                border: none;
            }

            .btn-custom:hover {
                background: #3b76da;
            }

            .user-card {
                background: #1a1d24;
                border: 1px solid #2d313b;
                border-radius: 16px;
                padding: 14px;
                transition: 0.3s;
                height: 100%;
            }

            .user-card:hover {
                transform: translateY(-4px);
                border-color: #4d8cff;
            }

            .avatar img {
                width: 70px;
                height: 70px;
                border-radius: 50%;
                object-fit: cover;
                border: 2px solid #4d8cff;
                flex-shrink: 0;
            }

            .user-name {
                font-size: 18px;
                font-weight: 600;
            }

            .info {
                font-size: 13px;
                color: #c7c7c7;
            }

            .info i {
                color: #4d8cff;
                margin-right: 6px;
            }
        </style>
    </head>

    <body>

        <div class="container-fluid wrapper">
            <div class="row top-bar align-items-center">
                <div class="col-lg-1">
                    <input type="number" id="user-count" class="form-control" placeholder="Enter number of users" value="1" min="1" max="100">
                </div>

                <div class="col-lg-2">
                    <button class="btn btn-custom w-100 text-white" id="refresh-btn">
                        <i class="bi bi-arrow-repeat"></i>
                        Refresh Users
                    </button>
                </div>
            </div>

            <div class="row g-3" id="info-cards"></div>
        </div>

    </body>

    <script>
        const infoCards = document.querySelector("#info-cards");
        const refreshBtn = document.querySelector("#refresh-btn");
        const userCountInput = document.querySelector("#user-count");

        function getUser(count = 1) {

            infoCards.innerHTML = "";

            fetch(`https://randomuser.me/api/?results=${count}`)
                .then((data) => data.json())
                .then((data) => {

                    data.results.forEach(function (user) {

                        const dob = new Date(user.dob.date)
                            .toISOString()
                            .split("T")[0];

                        const col = document.createElement("div");

                        col.className = "col-lg-3";
                        col.innerHTML = `<div class="user-card d-flex align-items-center gap-3">

                            <div class="avatar">
                                <img src="${user.picture.large}" alt="">
                            </div>

                            <div>
                                <div class="user-name">
                                    ${user.name.title} 
                                    ${user.name.first} 
                                    ${user.name.last}
                                </div>

                                <div class="info mb-1">
                                    <i class="bi bi-person"></i>
                                    ${user.gender.toUpperCase()}
                                </div>

                                <div class="info mb-1">
                                    <i class="bi bi-calendar-event"></i>
                                    ${dob}
                                </div>

                                <div class="info">
                                    <i class="bi bi-envelope-fill"></i>
                                    ${user.email}
                                </div>

                            </div>

                        </div>`;
                        infoCards.appendChild(col);
                    });
                })
                .catch(function (error) {
                    console.log("Error fetching API:", error);
                });
        }

        getUser();

        refreshBtn.addEventListener("click", function () {
            const count = userCountInput.value || 1;
            getUser(count);
        });

    </script>

</html>
