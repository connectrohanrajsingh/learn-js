<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/css/bootstrap.min.css" integrity="sha512-Ez0cGzNzHR1tYAv56860NLspgUGuQw16GiOOp/I2LuTmpSK9xDXlgJz3XN4cnpXWDmkNBKXR/VDMTCnAaEooxA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <title>Document</title>
    </head>

    <body class="bg-dark">
        <div class="row mt-5 p-4">
            <input type="text" class="form-control" id="inputbox">
            <span id="userinput" class="text-light"></span>
        </div>
    </body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/js/bootstrap.min.js" integrity="sha512-EKWWs1ZcA2ZY9lbLISPz8aGR2+L7JVYqBAYTq5AXgBkSjRSuQEGqWx8R1zAX16KdXPaCjOCaKE8MCpU0wcHlHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script>

        function userInput(delay) {

            timer = 1000;

            return function () {
                clearTimeout(timer);
                timer = setTimeout(
                    function () {
                        currentInput = document.querySelector("#inputbox");
                        document.querySelector("#userinput").textContent = '';
                        document.querySelector("#userinput").textContent = currentInput.value;
                    }, delay);
            }

        }

        document.querySelector("#inputbox").addEventListener("input", userInput(2000));

    </script>

</html>
